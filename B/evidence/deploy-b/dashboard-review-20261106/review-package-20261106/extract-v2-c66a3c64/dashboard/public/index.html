<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>Agent Loop · 运行面板</title>
    <link rel="stylesheet" href="/styles.css" />
    <script src="/app.js" type="module"></script>
  </head>
  <body>
    <aside class="sidebar">
      <a class="brand" href="#overview" aria-label="Agent Loop 总览"
        ><span class="brand-mark">a<span>↗</span></span
        ><span
          >agent<span class="brand-light">loop</span
          ><small>工作自动化 · 控制台</small></span
        ></a
      >
      <div class="workspace">
        <span class="workspace-icon">A</span>
        <div>我的工作区<small>本地中心 · 双机协同</small></div>
        <span class="workspace-lock">⌘</span>
      </div>
      <div class="nav-label">工作空间</div>
      <nav id="navigation" aria-label="主导航">
        <a href="#overview" data-view="overview"
          ><span data-icon="overview"></span>运行总览</a
        >
        <a href="#runs" data-view="runs"
          ><span data-icon="tasks"></span>任务记录<span
            id="nav-runs"
            class="nav-count"
            >—</span
          ></a
        >
        <a href="#items" data-view="items"
          ><span data-icon="workflow"></span>事项工作台</a
        >
        <a href="#plans" data-view="plans"
          ><span data-icon="clock"></span>后续计划</a
        >
        <a href="#workers" data-view="workers"
          ><span data-icon="server"></span>执行端</a
        >
        <a href="#attention" data-view="attention"
          ><span data-icon="inbox"></span>决策中心<span
            id="nav-attention"
            class="nav-count"
            >—</span
          ></a
        >
        <div class="nav-label">管理</div>
        <a href="#connections" data-view="connections"
          ><span data-icon="workflow"></span>规则与连接</a
        >
      </nav>
      <div class="sidebar-bottom">
        <div class="local-badge">
          <span class="status-dot"></span>本机面板<span>本人操作</span>
        </div>
        <p>看见进度，掌握每一步。</p>
        <div class="profile">
          <span class="avatar">我</span>
          <div>个人工作区<small>Agent Loop</small></div>
          <span class="profile-dot">●</span>
        </div>
      </div>
    </aside>
    <div class="main-shell">
      <header class="topbar">
        <div class="breadcrumb">
          工作区 <span>/</span> <b id="breadcrumb-current">运行总览</b>
        </div>
        <div class="topbar-right">
          <span id="connection-status" class="connection-status"
            >正在连接中心</span
          ><span class="read-only">本机专用</span>
        </div>
      </header>
      <main>
        <div class="page-heading">
          <div>
            <div class="eyebrow">WORKSPACE MONITOR</div>
            <h1 id="page-title">运行总览</h1>
            <p id="page-description">任务、执行端与待办，一处查看。</p>
          </div>
          <div class="heading-actions">
            <button id="auto-refresh" class="quiet-button" aria-pressed="true">
              <span class="status-dot"></span><span>自动更新</span></button
            ><button id="refresh" class="button">
              <span data-icon="refresh"></span>刷新
            </button>
          </div>
        </div>
        <div
          id="connection-alert"
          class="connection-alert"
          role="status"
          hidden
        ></div>
        <div id="view-content" aria-live="polite">
          <div class="loading-state">
            <span class="loading-ring"></span>
            <h2>正在读取中心状态</h2>
            <p>所有运行记录将直接来自当前中心。</p>
          </div>
        </div>
        <footer>
          <span><span class="tiny-dot"></span>数据来自本机中心</span
          ><span id="updated-at">等待首次同步</span>
        </footer>
      </main>
    </div>
    <dialog id="run-detail" aria-labelledby="detail-title">
      <div id="detail-content"></div>
    </dialog>
    <dialog id="action-dialog" aria-labelledby="action-title">
      <div id="action-content"></div>
    </dialog>
    <div id="action-message" class="action-message" role="status" hidden></div>
  </body>
</html>
